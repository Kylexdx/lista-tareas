name: Build Flet App
on: [push, workflow_dispatch]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: web
          - os: ubuntu-latest
            platform: apk
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flet
      - run: flet build ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.platform }}
          path: build/${{ matrix.platform }}
